name: Actions Workflow

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yaml

  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish.yaml
    secrets: inherit
