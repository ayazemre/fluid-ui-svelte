name: CI/CD Pipeline
on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  integrity:
    uses: ./.github/workflows/integrity.yaml
    permissions:
      contents: read
    secrets: inherit

  test:
    needs: integrity
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read
    secrets: inherit

  publish:
    if: github.ref == 'refs/heads/main' && needs.integrity.outputs.should_publish == 'true'
    needs: [integrity, test]
    uses: ./.github/workflows/publish.yaml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
